```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ClassWave</title>

  <meta http-equiv="refresh" content="3;url=https://classwave.pages.dev/">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #6d28d9;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .logo {
      width: clamp(90px, 25vw, 130px);
      height: clamp(90px, 25vw, 130px);
      object-fit: contain;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(24px, 6vw, 32px);
      line-height: 1.2;
      font-weight: 700;
    }

    p {
      margin: 0;
      font-size: clamp(15px, 4vw, 18px);
      line-height: 1.5;
      opacity: 0.95;
    }

    .progress-container {
      width: 100%;
      height: 6px;
      margin-top: 30px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: white;
      border-radius: 999px;
      animation: progress 3s linear forwards;
    }

    @keyframes progress {
      from {
        width: 0%;
      }

      to {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 20px;
      }

      .logo {
        margin-bottom: 20px;
      }

      .progress-container {
        margin-top: 26px;
        height: 5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-bar {
        animation-duration: 3s;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <img
      class="logo"
      src="https://classwave.pages.dev/public/logo.png"
      alt="ClassWave"
    >

    <h1>We've moved our site!</h1>

    <p>
      We're redirecting you to the official ClassWave site.
    </p>

    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>

  </main>

  <script>
    setTimeout(() => {
      window.location.replace("https://classwave.pages.dev/");
    }, 3000);
  </script>
</body>
</html>
```
